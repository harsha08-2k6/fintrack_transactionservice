spring.application.name=transaction-service
spring.profiles.default=local

# Port Number (Dynamic for Cloud/Render and fallback to 8084 locally)
server.port=${PORT:8084}

# Eureka Client Configuration
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:https://fintrack-eurekaserver.onrender.com/eureka/}}
eureka.instance.prefer-ip-address=true
fintrack.internal.gateway-key=${INTERNAL_GATEWAY_KEY:}
eureka.instance.instance-id=${spring.application.name}:${server.port}

# PostgreSQL Configuration (Externalized environment credentials)
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fintrack}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Actuator Endpoints
management.endpoints.web.exposure.include=health,info

# Gmail SMTP Notification Configuration
fintrack.mail.host=${SMTP_HOST:smtp.gmail.com}
fintrack.mail.port=${SMTP_PORT:587}
fintrack.mail.username=${SMTP_USERNAME:}
fintrack.mail.password=${SMTP_PASSWORD:}
fintrack.mail.from-email=${SMTP_FROM_EMAIL:no-reply@fintrack.com}
fintrack.mail.from-name=${SMTP_FROM_NAME:FinTrack Notifications}
fintrack.mail.enabled=${SMTP_ENABLED:false}
fintrack.mail.auth=true
fintrack.mail.starttls.enable=true
fintrack.mail.starttls.required=true
fintrack.mail.timeout-ms=10000
fintrack.mail.connection-timeout-ms=10000
fintrack.mail.write-timeout-ms=10000
fintrack.mail.google-script-url=${GOOGLE_SCRIPT_MAIL_URL:}
fintrack.mail.app-url=${APP_FRONTEND_URL:https://fintrack-tau-teal.vercel.app}
